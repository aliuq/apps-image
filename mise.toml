[tools]
act = "latest"

[tasks.clean]
description = "Clean image and builder cache"
run = '''
echo "Cleaning image and builder cache..."
docker image prune -af
echo "\n"
docker builder prune -af
'''

[tasks.clean-cache-all]
description = "Clean all cacheed layers on aliuq/apps-image"
run = "gh cache delete --repo aliuq/apps-image --all"